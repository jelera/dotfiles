# Lefthook Configuration
# https://github.com/evilmartians/lefthook
#
# Git hooks for code quality and security checks
# Install: lefthook install
# Run manually: lefthook run pre-commit

# Run shellcheck on staged shell scripts
pre-commit:
  parallel: true
  commands:
    # Lint shell scripts (uses .shellcheckrc: bash 4.0+, severity=warning)
    shellcheck:
      glob: "*.sh"
      run: shellcheck --severity=warning {staged_files}
      skip:
        - merge
        - rebase

    # Lint shell scripts without .sh extension (uses .shellcheckrc: bash 4.0+, severity=warning)
    shellcheck-no-ext:
      glob: "{bin/*,shell/functions,shell/env}"
      exclude: "*.md"
      run: shellcheck --severity=warning {staged_files}
      skip:
        - merge
        - rebase

    # Check for secrets/leaks in staged files
    gitleaks:
      run: gitleaks protect --verbose --redact --staged
      skip:
        - merge
        - rebase

    # Identity lives in ~/.gitconfig.local; `git config --global user.*` writes into the
    # tracked git/gitconfig (via the ~/.gitconfig symlink), so block it at commit time
    no-identity-in-gitconfig:
      glob: "git/gitconfig"
      run: |
        if git show :git/gitconfig | git config --file /dev/stdin --get-regexp '^user\.(name|email|signingkey)$' >/dev/null; then
          echo "❌ Error: user identity found in git/gitconfig. Keep it in ~/.gitconfig.local"
          exit 1
        fi
      skip:
        - merge
        - rebase

    # Check for trailing whitespace
    trailing-whitespace:
      glob: "*.{sh,md,yml,yaml,toml,zsh}"
      run: |
        if grep -n '[[:space:]]$' {staged_files} 2>/dev/null; then
          echo "❌ Error: Trailing whitespace found"
          exit 1
        fi
      skip:
        - merge
        - rebase

# Full security scan before pushing
pre-push:
  parallel: true
  commands:
    # Full repository scan for secrets
    gitleaks-full:
      run: gitleaks detect --verbose --redact
      skip:
        - merge
        - rebase
